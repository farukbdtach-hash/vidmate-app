<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidMate Lite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background-color: #0d0d0d; color: #fff; padding-bottom: 50px; }
    
    .header { background: #1f1f1f; padding: 12px 15px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 10px; }
    .logo { color: #ff0055; font-size: 18px; font-weight: bold; text-decoration: none; }
    .search-box { flex: 1; display: flex; background: #121212; border-radius: 20px; padding: 4px 10px; border: 1px solid #333; }
    .search-box input { flex: 1; background: transparent; border: none; color: white; padding: 6px; font-size: 14px; outline: none; }
    .search-box button { background: #ff0055; color: white; border: none; padding: 6px 14px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; }

    .container { max-width: 500px; margin: 0 auto; padding: 10px; }
    .player-container { background: #000; border-radius: 12px; overflow: hidden; position: sticky; top: 60px; z-index: 90; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    video { width: 100%; aspect-ratio: 16/9; display: block; }
    
    .meta-card { background: #181818; padding: 12px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; margin-bottom: 15px; }
    .v-title { font-size: 14px; font-weight: bold; margin-bottom: 6px; line-height: 1.3; }
    .v-channel { font-size: 12px; color: #aaa; }

    .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #282828; }
    .vidmate-dl-btn { background: linear-gradient(45deg, #ff0055, #ff5500); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.4); }

    .feed-item { display: flex; gap: 10px; background: #181818; margin-bottom: 8px; padding: 8px; border-radius: 8px; cursor: pointer; }
    .feed-item img { width: 110px; height: 65px; object-fit: cover; border-radius: 6px; }
    .feed-info { flex: 1; }
    .feed-title { font-size: 12px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .feed-uploader { font-size: 10px; color: #888; margin-top: 4px; }

    .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #1f1f1f; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; z-index: 200; transition: bottom 0.3s ease; box-shadow: 0 -5px 25px rgba(0,0,0,0.8); }
    .bottom-sheet.active { bottom: 0; }
    .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 150; display: none; }
    .sheet-overlay.active { display: block; }
    
    .sheet-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #ff0055; text-align: center; }
    .q-option { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
    .q-option:hover { background: #ff0055; }
    .q-text { font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="header">
    <a href="#" class="logo">VidMate Lite</a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Video...">
      <button onclick="performSearch()">Search</button>
    </div>
  </div>

  <div class="container">
    <div class="player-container">
      <video id="mainVideo" controls autoplay poster="https://via.placeholder.com/600x340/111/fff?text=VidMate+Lite">
        <source id="videoSource" src="" type="video/mp4">
      </video>
    </div>

    <div class="meta-card">
      <div class="v-title" id="mainTitle">ইউজার ভিত্তিক ক্লায়েন্ট-সাইড ভিডিও প্লেয়ার</div>
      <div class="v-channel" id="mainChannel">সার্ভার খরচ: ৳০.০০</div>
      
      <div class="action-row">
        <span style="font-size: 12px; color: #aaa;">ডাউনলোড অপশন</span>
        <button class="vidmate-dl-btn" onclick="toggleSheet(true)">⬇</button>
      </div>
    </div>

    <div style="font-size: 12px; color: #888; margin-bottom: 10px;">ভিডিও রেজাল্ট (Client IP Powered)</div>
    <div id="feedList"></div>
  </div>

  <div class="sheet-overlay" id="overlay" onclick="toggleSheet(false)"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-title">ডাউনলোড কোয়ালিটি (VidMate)</div>
    <div class="q-option" onclick="downloadVideo('1080p')">
      <span class="q-text">🎬 Full HD 1080p</span>
      <span style="font-size: 11px; color: #aaa;">MP4</span>
    </div>
    <div class="q-option" onclick="downloadVideo('720p')">
      <span class="q-text">🎬 HD 720p</span>
      <span style="font-size: 11px; color: #aaa;">MP4</span>
    </div>
    <div class="q-option" onclick="downloadVideo('360p')">
      <span class="q-text">📱 SD 360p</span>
      <span style="font-size: 11px; color: #aaa;">MP4</span>
    </div>
  </div>

  <script>
    function toggleSheet(show) {
      document.getElementById('bottomSheet').classList.toggle('active', show);
      document.getElementById('overlay').classList.toggle('active', show);
    }
    function performSearch() {
      const q = document.getElementById('searchInput').value;
      if(q) alert("Searching for: " + q + "\n(ইউজারের নিজস্ব আইপি থেকে সরাসরি রিকোয়েস্ট যাবে)");
    }
    function downloadVideo(q) {
      toggleSheet(false);
      alert(q + " ডাউনলোড প্রসেস হচ্ছে সম্পূর্ণ ক্লায়েন্ট সাইডে!");
    }
  </script>
</body>
</html>
